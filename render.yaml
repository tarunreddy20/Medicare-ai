services:
  - type: web
    name: medicare-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-12-01-preview
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-4o
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHROMA_DB_PATH
        value: /opt/render/project/data/chroma_db
    disk:
      name: chroma-data
      mountPath: /opt/render/project/data
      sizeGB: 1
